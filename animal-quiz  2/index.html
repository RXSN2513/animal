<title>测一测｜你像什么动物</title>

<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
:root{
  --bg:#FFF6EC;
  --bg-soft:#FFFDF9;
  --card:#FFFFFF;
  --ink:#4A3728;
  --ink-soft:#8A7463;
  --primary:#FF8A5C;
  --primary-deep:#F2693B;
  --line:#F5E3D2;
  --shadow:0 12px 32px rgba(242,105,59,.12);
  --c-cat:#F5A25D;
  --c-dog:#F2C14E;
  --c-rabbit:#F29AAE;
  --c-turtle:#63C4A0;
  --c-fox:#E8794A;
  --radius:24px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  min-height:100%;
  display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
/* 桌面端背景装饰 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,138,92,.10) 0 60px, transparent 61px),
    radial-gradient(circle at 88% 12%, rgba(242,193,78,.12) 0 50px, transparent 51px),
    radial-gradient(circle at 80% 88%, rgba(99,196,160,.10) 0 70px, transparent 71px),
    radial-gradient(circle at 8% 82%, rgba(242,154,174,.10) 0 55px, transparent 56px);
}
.shell{
  position:relative;z-index:1;
  width:100%;max-width:560px;
  min-height:100%;
  padding:24px 20px calc(28px + env(safe-area-inset-bottom));
}
.view{display:none;animation:fadeUp .45s ease both}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== 通用卡片 ===== */
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;border:none;cursor:pointer;
  font-family:inherit;font-size:17px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-deep) 100%);
  border-radius:999px;padding:15px 24px;
  box-shadow:0 8px 20px rgba(242,105,59,.28);
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{
  background:transparent;color:var(--ink-soft);
  box-shadow:none;border:1.5px solid var(--line);font-weight:500;
}

/* ===== 开始页 ===== */
.start-hero{
  border-radius:28px;overflow:hidden;
  box-shadow:var(--shadow);
}
.start-hero img{display:block;width:100%;height:auto}
.brand-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1.5px solid var(--line);
  color:var(--primary-deep);font-size:13px;font-weight:700;
  padding:6px 14px;border-radius:999px;margin:18px 0 12px;
}
.start-title{
  font-family:"Noto Serif SC","Noto Sans SC",serif;
  font-size:32px;font-weight:900;line-height:1.3;letter-spacing:1px;
}
.start-title em{font-style:normal;color:var(--primary-deep)}
.start-sub{color:var(--ink-soft);font-size:15px;margin:10px 0 6px}
.start-meta{
  display:flex;align-items:center;gap:6px;
  color:var(--ink-soft);font-size:13px;margin-bottom:22px;
}
.start-meta svg{width:15px;height:15px;stroke:var(--primary)}
.animals-row{
  display:flex;gap:10px;margin:18px 0 24px;
}
.animals-row .mini{flex:1;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#fff}
.animals-row .mini img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover}
.animals-row .mini span{display:block;text-align:center;font-size:12px;color:var(--ink-soft);padding:4px 0 6px;font-weight:500}

/* ===== 答题页 ===== */
.quiz-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.quiz-progress{
  flex:1;height:10px;border-radius:999px;background:#F7E8D8;overflow:hidden;
}
.quiz-progress i{
  display:block;height:100%;border-radius:999px;width:0;
  background:linear-gradient(90deg,var(--primary),var(--c-fox));
  transition:width .4s ease;
}
.quiz-count{font-size:13px;font-weight:700;color:var(--primary-deep);white-space:nowrap}
.quiz-card{padding:26px 22px 22px}
.q-title{
  font-family:"Noto Serif SC",serif;font-size:21px;font-weight:900;line-height:1.45;
  margin-bottom:20px;
}
.options{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;
  background:var(--bg-soft);border:2px solid var(--line);
  border-radius:16px;padding:13px 16px;cursor:pointer;
  font-family:inherit;font-size:15.5px;color:var(--ink);font-weight:500;
  text-align:left;transition:all .18s ease;
}
.opt .dot{
  flex:none;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:#fff;background:var(--line);
}
.opt span.txt{flex:1}
.opt:active{transform:scale(.985)}
.opt.sel{
  border-color:var(--primary);background:#FFF2EA;
}
.opt.sel .dot{background:linear-gradient(135deg,var(--primary),var(--primary-deep))}
.quiz-next{
  margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;
}

/* ===== 结果页 ===== */
.result-hero{position:relative;text-align:center;padding:30px 20px 0}
.result-animal{
  width:168px;height:168px;margin:0 auto;border-radius:50%;
  overflow:hidden;border:5px solid #fff;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both;
}
.result-animal img{width:100%;height:100%;object-fit:cover}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.badge{
  display:inline-block;margin-top:18px;padding:6px 16px;border-radius:999px;
  font-size:13px;font-weight:700;color:#fff;
}
.result-title{
  font-family:"Noto Serif SC",serif;font-size:27px;font-weight:900;line-height:1.4;
  margin:10px 0 6px;
}
.result-sub{color:var(--ink-soft);font-size:14px;margin-bottom:14px}
.result-desc{
  max-width:420px;margin:0 auto;padding:0 22px;
  color:#6B5646;font-size:15px;
}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 22px;padding:0 22px}
.tag{
  font-size:13px;font-weight:700;color:#fff;
  border-radius:999px;padding:5px 13px;
}
.breakdown{
  margin:0 22px 22px;padding:16px 18px;border-radius:18px;
  background:var(--bg-soft);border:1.5px solid var(--line);
}
.breakdown h4{font-size:13px;color:var(--ink-soft);font-weight:700;margin-bottom:12px}
.break-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px}
.break-row:last-child{margin-bottom:0}
.break-row .name{width:56px;color:var(--ink-soft);font-weight:500;flex:none}
.break-row .bar{flex:1;height:10px;border-radius:999px;background:#F3E4D4;overflow:hidden}
.break-row .bar i{display:block;height:100%;border-radius:999px;transition:width .8s ease}
.break-row .num{width:24px;text-align:right;font-weight:700;color:var(--ink);flex:none}

.result-actions{display:flex;flex-direction:column;gap:12px;padding:0 0 8px}
.share-hint{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:14px}
.footer-note{
  text-align:center;font-size:12px;color:#C0AA97;margin-top:26px;
}
.footer-note a{color:#C0AA97;text-decoration:underline}

/* 弹层 toast */
.toast{
  position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);
  background:rgba(74,55,40,.94);color:#fff;font-size:14px;
  padding:12px 20px;border-radius:14px;z-index:99;opacity:0;
  transition:all .3s ease;pointer-events:none;max-width:80%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:420px){
  .start-title{font-size:28px}
  .q-title{font-size:19px}
  .result-title{font-size:24px}
  .shell{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="shell">

  <!-- ===== 视图：开始页 ===== -->
  <section class="view active" id="view-start">
    <div class="start-hero">
      <img src="assets/hero.jpg" alt="五只可爱小动物排排坐">
    </div>

      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2z"/></svg>
      趣味人格测试
    </div>

    <div class="start-meta">

      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </section>

  <!-- ===== 视图：答题页 ===== -->
  <section class="view" id="view-quiz">
    <div class="quiz-head">
      <div class="quiz-progress"><i id="progress-bar"></i></div>
      <div class="quiz-count" id="quiz-count">1 / 10</div>
    </div>
    <div class="card quiz-card">
      <h2 class="q-title" id="q-title"></h2>
      <div class="options" id="q-options"></div>
      <button class="btn quiz-next" id="btn-next" disabled style="opacity:.45">
        下一题
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

  <!-- ===== 视图：结果页 ===== -->
  <section class="view" id="view-result">

        <h4>你的答案分布</h4>
        <div id="r-breakdown"></div>

        <button class="btn ghost" id="btn-copy">复制我的结果</button>
        <button class="btn ghost" id="btn-retry">再测一次</button>
      </div>
    </div>
    <p class="share-hint">把结果分享到评论区，看看朋友像什么动物</p>
    <p class="footer-note">仅供娱乐 · 测试页面 · 数据仅保存在本机浏览器</p>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
/* ==================== 题库（10 题 × 5 选项） ==================== */
var ANIMALS = [
  { key: "cat",    name: "猫咪", color: "#F5A25D", badge: "#F5A25D" },
  { key: "dog",    name: "小狗", color: "#F2C14E", badge: "#F2C14E" },
  { key: "rabbit", name: "兔子", color: "#F29AAE", badge: "#F29AAE" },
  { key: "turtle", name: "乌龟", color: "#63C4A0", badge: "#63C4A0" },
  { key: "fox",    name: "狐狸", color: "#E8794A", badge: "#E8794A" }
];

var RESULTS = {
  cat: {
    name: "高冷猫系", img: "assets/cat.jpg", color: "#F5A25D",
    sub: "外冷内热 · 独立清醒",
    desc: "表面清冷独立，内心柔软有底线。不爱被束缚，有自己的小世界，只对信任的人展露温柔。你看起来不好接近，其实比谁都念旧情。",
    tags: ["独立清醒", "边界感强", "外冷内热", "审美在线"]
  },
  dog: {
    name: "元气犬系", img: "assets/dog.jpg", color: "#F2C14E",
    sub: "真诚热烈 · 治愈担当",
    desc: "真诚热烈，共情力强。待人赤诚，很看重陪伴，开心难过都写在脸上，是朋友身边的小太阳和情绪靠山。",
    tags: ["真诚坦率", "元气满满", "重感情", "治愈力"]
  },
  rabbit: {
    name: "软萌兔系", img: "assets/rabbit.jpg", color: "#F29AAE",
    sub: "温柔细腻 · 氛围感拉满",
    desc: "软萌细腻，内心敏感。外表软软的，内心却很坚韧，偏爱温柔治愈的氛围，对生活里的小美好总是第一个发现。",
    tags: ["软萌可爱", "细腻敏感", "共情力强", "氛围感"]
  },
  turtle: {
    name: "佛系龟系", img: "assets/turtle.jpg", color: "#63C4A0",
    sub: "情绪稳定 · 慢活派",
    desc: "佛系稳重，情绪稳定。不急不躁，擅长自愈，不喜欢冲突，追求安稳舒服的小日子。你的慢，是别人羡慕不来的从容。",
    tags: ["佛系淡定", "情绪稳定", "靠谱", "慢生活"]
  },
  fox: {
    name: "机灵狐系", img: "assets/fox.jpg", color: "#E8794A",
    sub: "心思通透 · 神秘魅力",
    desc: "外冷内热，心思通透。观察力强，情商在线，自带一点神秘感，总能在关键时刻看透本质、轻松破局。",
    tags: ["聪明机智", "高情商", "神秘感", "观察力"]
  }
};

var QUESTIONS = [
  { q: "周末有空，你更想？",
    o: [["宅家独处，享受安静","cat"],["约朋友出门，热热闹闹","dog"],["短途散步探店，轻松治愈","rabbit"],["在家慢悠悠躺平追剧","turtle"],["随心安排，看心情决定","fox"]] },
  { q: "和朋友闹矛盾，你会？",
    o: [["先拉开距离冷静一下","cat"],["直接说开，尽快和好","dog"],["委婉表达，怕伤感情","rabbit"],["放一放，让时间解决","turtle"],["察言观色，巧妙化解","fox"]] },
  { q: "遇到新鲜事，你的习惯是？",
    o: [["先观望评估再上手","cat"],["兴致来了立刻尝试","dog"],["有人陪着才敢试","rabbit"],["慢慢规划稳步推进","turtle"],["找捷径灵活变通","fox"]] },
  { q: "你最喜欢别人夸你什么？",
    o: [["有边界感、不黏人","cat"],["真诚好相处","dog"],["温柔好亲近","rabbit"],["稳重靠谱","turtle"],["聪明有想法","fox"]] },
  { q: "压力大的时候你会？",
    o: [["独自消化，不想说","cat"],["找人吐槽释放情绪","dog"],["吃顿好的安抚自己","rabbit"],["顺其自然不内耗","turtle"],["转移注意力换思路","fox"]] },
  { q: "社交场合你通常是？",
    o: [["安静待在角落","cat"],["主动带动气氛","dog"],["礼貌温和不抢话","rabbit"],["低调少发言","turtle"],["看人说话游刃有余","fox"]] },
  { q: "买东西时你更看重？",
    o: [["认准喜欢的就买","cat"],["朋友推荐就心动","dog"],["颜值第一好看","rabbit"],["反复对比性价比","turtle"],["看测评抓核心卖点","fox"]] },
  { q: "计划被打乱，你会？",
    o: [["有点烦躁，想回节奏","cat"],["随机应变，觉得有趣","dog"],["有点慌，需要安抚","rabbit"],["心态平稳，重新安排","turtle"],["快速调整，换个方案","fox"]] },
  { q: "你喜欢的相处模式是？",
    o: [["保留个人空间","cat"],["随时分享日常","dog"],["温柔体贴互相照顾","rabbit"],["平淡长久细水长流","turtle"],["保留一点神秘感","fox"]] },
  { q: "面对未知挑战，你的心态？",
    o: [["谨慎，先评估风险","cat"],["充满期待，跃跃欲试","dog"],["有点忐忑，但愿意试","rabbit"],["不冒没必要的险","turtle"],["见招拆招，灵活应对","fox"]] }
];

/* ==================== 视图切换 ==================== */
function show(id){
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

/* ==================== 答题逻辑 ==================== */
var answers = new Array(QUESTIONS.length).fill(null);
var current = 0;

function renderQuestion(i){
  var q = QUESTIONS[i];
  document.getElementById("q-title").textContent = q.q;
  document.getElementById("quiz-count").textContent = (i+1) + " / 10";
  document.getElementById("progress-bar").style.width = ((i)/10*100) + "%";
  var box = document.getElementById("q-options");
  box.innerHTML = "";
  q.o.forEach(function(opt, idx){
    var b = document.createElement("button");
    b.className = "opt" + (answers[i] === opt[1] ? " sel" : "");
    b.setAttribute("data-key", opt[1]);
    b.innerHTML = '<span class="dot">' + "ABCDE".charAt(idx) + '</span><span class="txt">' + opt[0] + '</span>';
    b.addEventListener("click", function(){
      answers[i] = opt[1];
      var sels = box.querySelectorAll(".opt");
      for (var k=0;k<sels.length;k++) sels[k].classList.remove("sel");
      b.classList.add("sel");
      var next = document.getElementById("btn-next");
      next.disabled = false;
      next.style.opacity = "1";
    });
    box.appendChild(b);
  });
  var next = document.getElementById("btn-next");
  next.disabled = answers[i] === null;
  next.style.opacity = answers[i] === null ? ".45" : "1";
}

function nextQuestion(){
  if (answers[current] === null){ toast("先选一个答案吧"); return; }
  current++;
  if (current >= QUESTIONS.length){
    finish();
  } else {
    renderQuestion(current);
  }
}

/* ==================== 结果计算与展示 ==================== */
function finish(){
  var score = { cat:0, dog:0, rabbit:0, turtle:0, fox:0 };
  answers.forEach(function(a){ if(a) score[a]++; });
  // 票数最高者胜出（平局取 ANIMALS 顺序靠前者）
  var top = "cat", topN = -1;
  ANIMALS.forEach(function(an){
    if (score[an.key] > topN){ top = an.key; topN = score[an.key]; }
  });
  lastKey = top;
  var r = RESULTS[top];

  document.getElementById("r-img").src = r.img;
  document.getElementById("r-badge").textContent = "你的动物人格";
  document.getElementById("r-badge").style.background = r.color;
  document.getElementById("r-title").textContent = r.name;
  document.getElementById("r-sub").textContent = r.sub;
  document.getElementById("r-desc").textContent = r.desc;

  var tags = document.getElementById("r-tags");
  tags.innerHTML = "";
  r.tags.forEach(function(t){
    var s = document.createElement("span");
    s.className = "tag";
    s.style.background = r.color;
    s.textContent = t;
    tags.appendChild(s);
  });

  // 答案分布
  var bd = document.getElementById("r-breakdown");
  bd.innerHTML = "";
  ANIMALS.forEach(function(an, idx){
    var n = score[an.key];
    var pct = Math.round(n/10*100);
    var row = document.createElement("div");
    row.className = "break-row";
    row.innerHTML = '<span class="name">' + an.name + '</span>' +
      '<span class="bar"><i style="width:0;background:' + an.color + '"></i></span>' +
      '<span class="num">' + n + '</span>';
    bd.appendChild(row);
    setTimeout(function(){
      row.querySelector(".bar i").style.width = (n/10*100) + "%";
    }, 100 + idx*120);
  });

  show("view-result");
}

/* ==================== 工具 ==================== */
var lastKey = "cat";
var toastTimer = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function copyText(txt){
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("结果已复制，去评论区发出来吧"); }
    catch(e){ toast("复制失败，长按选中文字手动复制"); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      toast("结果已复制，去评论区发出来吧");
    }, fallback);
  } else { fallback(); }
}
